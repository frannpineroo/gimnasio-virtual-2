<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TRAINING! - Entrenadores</title>
    
    <!-- CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    
    <!-- CSS OPTIMIZADO -->
    <link rel="stylesheet" href="css/base/variables.css" />
    <link rel="stylesheet" href="css/base/globals.css" />
    <link rel="stylesheet" href="css/components/header.css" />
    <link rel="stylesheet" href="css/components/sidebar.css" />
    <link rel="stylesheet" href="css/components/table.css" />
    <link rel="stylesheet" href="css/components/buttons.css" />
    <link rel="stylesheet" href="css/components/modal.css" />
    <link rel="stylesheet" href="css/components/filters.css" />
</head>
<body>
    <main class="main-content">
        <!-- Sección de Entrenadores -->
        <div class="coaches-section">
            <div class="section-header">
                <h2 class="section-title">Gestión de Entrenadores</h2>
                <button class="btn btn-primary" id="add-coach-btn">
                    <i class="fas fa-plus"></i> Nuevo Entrenador
                </button>
            </div>

            <!-- Filtros Reutilizables -->
            <div class="filters">
                <div class="filter-group">
                    <label class="filter-label"><i class="fas fa-search"></i> Buscar</label>
                    <div class="search">
                        <i class="fas fa-search"></i>
                        <input type="text" placeholder="Buscar entrenador..." id="search-input" />
                    </div>
                </div>

                <div class="filter-group">
                    <label class="filter-label"><i class="fas fa-filter"></i> Estado</label>
                    <div class="custom-select" id="status-select">
                        <div class="select-trigger">
                            <div class="selected-value">
                                <i class="fas fa-list"></i>
                                <span>Todos los estados</span>
                            </div>
                        </div>
                        <div class="select-options">
                            <div class="select-option" data-value="">
                                <i class="fas fa-list"></i>
                                <span>Todos los estados</span>
                            </div>
                            <div class="select-option" data-value="active">
                                <i class="fas fa-user-check"></i>
                                <span>Activo</span>
                            </div>
                            <div class="select-option" data-value="inactive">
                                <i class="fas fa-user-clock"></i>
                                <span>Inactivo</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="filter-group">
                    <label class="filter-label" style="opacity: 0;">Acciones</label>
                    <button id="reset-filters" class="btn btn-secondary">
                        <i class="fas fa-sync-alt"></i> Resetear
                    </button>
                </div>
            </div>

            <!-- Tabla Reutilizable -->
            <div class="table-container">
                <table class="data-table" id="coaches-table">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Apellido</th>
                            <th>DNI</th>
                            <th>Email</th>
                            <th>Especialidad</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="coaches-table-body">
                        <!-- Datos cargados dinámicamente -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal Base Reutilizable -->
    <div class="modal" id="coach-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Nuevo Entrenador</h2>
                <button class="close-modal" id="close-modal">&times;</button>
            </div>
            <form id="coach-form" class="modal-form">
                <input type="hidden" id="coach-id">
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="coach-name">Nombre *</label>
                        <input type="text" id="coach-name" required>
                    </div>
                    <div class="form-group">
                        <label for="coach-last-name">Apellido *</label>
                        <input type="text" id="coach-last-name" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="coach-dni">DNI *</label>
                        <input type="text" id="coach-dni" required>
                    </div>
                    <div class="form-group">
                        <label for="coach-email">Email *</label>
                        <input type="email" id="coach-email" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="coach-phone">Teléfono</label>
                        <input type="text" id="coach-phone">
                    </div>
                    <div class="form-group">
                        <label for="coach-specialty">Especialidad</label>
                        <input type="text" id="coach-specialty">
                    </div>
                </div>

                <div class="form-group">
                    <label for="coach-certifications">Certificaciones</label>
                    <textarea id="coach-certifications" rows="3" placeholder="Lista de certificaciones..."></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="coach-experience">Años de Experiencia</label>
                        <input type="number" id="coach-experience" min="0" value="0">
                    </div>
                    <div class="form-group">
                        <label for="coach-status">Estado *</label>
                        <select id="coach-status" required>
                            <option value="active">Activo</option>
                            <option value="inactive">Inactivo</option>
                        </select>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="cancel-form">Cancelar</button>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Guardar Entrenador
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- SCRIPTS OPTIMIZADOS -->
    <script src="js/utils/constants.js"></script>
    <script src="js/utils/helpers.js"></script>
    <script src="js/utils/storage.js"></script>
    <script src="js/components/header.js"></script>
    <script src="js/components/sidebar.js"></script>
    <script src="js/components/table-manager.js"></script>
    <script src="js/components/modal-manager.js"></script>
    <script src="js/core/app.js"></script>
    <script src="js/pages/entrenadores.js"></script>
</body>
</html>
