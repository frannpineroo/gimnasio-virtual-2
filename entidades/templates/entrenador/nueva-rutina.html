{% extends 'entrenador/base.html' %}
{% load static %}

{% block title %}Nueva Rutina{% endblock %}

{% block content %}
<main class="main-content">
    <div class="new-routine-section">
        <div class="form-container">
            <div class="form-header">
                <h1 class="form-title">Nueva Rutina</h1>
                <a href="{% url 'entrenador:rutinas' %}" class="form-back-btn">
                    <i class="fas fa-arrow-left"></i> Volver a Rutinas
                </a>
            </div>

            <form action="/entrenador/rutinas/nuevo/" method="post">
                {% csrf_token %}
                {{ form.as_p }}
                
                <div class="form-actions">
                    <a href="{% url 'entrenador:rutinas' %}" class="btn-form-cancel">
                        <i class="fas fa-times"></i> Cancelar
                    </a>
                    <button type="submit" class="btn-form-submit">
                        <i class="fas fa-save"></i> Guardar Rutina
                    </button>
                </div>
            </form>
        </div>
    </div>
</main>
{% endblock %}
