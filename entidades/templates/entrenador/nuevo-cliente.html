{% extends 'entrenador/base.html' %}
{% load static %}

{% block title %}Nuevo Cliente{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'entrenador/css/components/formularios.css' %}">
{% endblock %}

{% block content %}
<main class="main-content">
    <div class="form-page-section">
        <div class="form-container">

            <div class="form-header">
                <h1 class="form-title">Nuevo Cliente</h1>
                <a href="{% url 'entrenador:clientes' %}" class="form-back-btn">
                    <i class="fas fa-arrow-left"></i> Volver a Clientes
                </a>
            </div>

            <form id="cliente-form" class="form-content">

                <!-- Sección 1: Información personal -->
                <div class="form-section">
                    <h3 class="form-section-title">Información Personal</h3>
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label class="required">Nombre</label>
                            <input type="text" class="form-control" placeholder="Ingrese el nombre" required>
                        </div>

                        <div class="form-group">
                            <label class="required">Apellido</label>
                            <input type="text" class="form-control" placeholder="Ingrese el apellido" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label class="required">DNI</label>
                            <input type="text" class="form-control" placeholder="Ingrese el DNI" required>
                        </div>

                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" class="form-control" placeholder="Ingrese el email">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Teléfono</label>
                            <input type="tel" class="form-control" placeholder="Ingrese el teléfono">
                        </div>

                        <div class="form-group">
                            <label class="required">Nivel de Experiencia</label>
                            <select class="form-select" required>
                                <option value="" selected>Seleccione nivel</option>
                                <option value="principiante">Principiante</option>
                                <option value="intermedio">Intermedio</option>
                                <option value="avanzado">Avanzado</option>
                                <option value="experto">Experto</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Separador visual -->
                <hr class="form-separator">

                <!-- Sección 2: Información de entrenamiento -->
                <div class="form-section">
                    <h3 class="form-section-title">Información de Entrenamiento</h3>
                    
                    <div class="form-group">
                        <label class="required">Objetivo</label>
                        <select class="form-select" required>
                            <option value="" selected>Seleccione objetivo</option>
                            <option value="perdida_grasa">Pérdida de grasa</option>
                            <option value="ganancia_muscular">Ganancia muscular</option>
                            <option value="mejora_rendimiento">Mejora de rendimiento</option>
                            <option value="rehabilitacion">Rehabilitación</option>
                            <option value="mantenimiento">Mantenimiento</option>
                            <option value="tonificacion">Tonificación</option>
                            <option value="fuerza">Aumento de fuerza</option>
                            <option value="resistencia">Mejora de resistencia</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Lesiones o condiciones médicas</label>
                        <textarea class="form-control" rows="3" placeholder="Describa lesiones o condiciones médicas relevantes..."></textarea>
                    </div>

                    <div class="form-group">
                        <label class="required">Estado</label>
                        <select class="form-select" required>
                            <option value="activo" selected>Activo</option>
                            <option value="inactivo">Inactivo</option>
                        </select>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn-form-cancel">Cancelar</button>
                    <button type="submit" class="btn-form-submit">
                        <i class="fas fa-save"></i> Guardar Cliente
                    </button>
                </div>

            </form>
        </div>
    </div>
</main>
{% endblock %}
