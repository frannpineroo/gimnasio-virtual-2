{% extends 'entrenador/base.html' %}
{% load static %}

{% block title %}Nuevo Cliente{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'entrenador/css/components/formularios.css' %}">
{% endblock %}

{% block content %}
<main class="main-content">
    <div class="form-page-section">
        <div class="form-container">

            <div class="form-header">
                <h1 class="form-title">Nuevo Cliente</h1>
                <a href="{% url 'entrenador:clientes' %}" class="form-back-btn">
                    <i class="fas fa-arrow-left"></i> Volver a Clientes
                </a>
            </div>

            <form id="cliente-form" class="form-content">

                <div class="form-row">
                    <div class="form-group">
                        <label class="required">Nombre</label>
                        <input type="text" class="form-control" placeholder="Ingrese el nombre" required>
                    </div>

                    <div class="form-group">
                        <label class="required">Apellido</label>
                        <input type="text" class="form-control" placeholder="Ingrese el apellido" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>DNI</label>
                        <input type="text" class="form-control" placeholder="Ingrese el DNI">
                    </div>

                    <div class="form-group">
                        <label>Teléfono</label>
                        <input type="tel" class="form-control" placeholder="Ingrese el teléfono">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Estado</label>
                        <select class="form-select">
                            <option value="" selected>Seleccione estado</option>
                            <option value="activo">Activo</option>
                            <option value="inactivo">Inactivo</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Grupo Muscular</label>
                        <select class="form-select">
                            <option value="" selected>Seleccione grupo</option>
                            <option value="pecho">Pecho</option>
                            <option value="espalda">Espalda</option>
                            <option value="piernas">Piernas</option>
                        </select>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn-form-cancel">Cancelar</button>
                    <button type="submit" class="btn-form-submit">
                        <i class="fas fa-save"></i> Guardar Cliente
                    </button>
                </div>

            </form>
        </div>
    </div>
</main>
{% endblock %}
