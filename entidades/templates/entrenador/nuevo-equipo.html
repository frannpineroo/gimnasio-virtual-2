{% extends 'entrenador/base.html' %}
{% load static %}

{% block title %}Nuevo Equipo{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'entrenador/css/components/formularios.css' %}">
{% endblock %}

{% block content %}
<main class="main-content">
    <div class="form-page-section">
        <div class="form-container">
            <div class="form-header">
                <h1 class="form-title">Nuevo Equipo</h1>
                <a href="{% url 'entrenador:equipos' %}" class="form-back-btn">
                    <i class="fas fa-arrow-left"></i> Volver a Equipos
                </a>
            </div>

            <form id="equipo-form" class="form-content">
                <div class="form-group">
                    <label for="nombre" class="required">Nombre del Equipo</label>
                    <input type="text" id="nombre" class="form-control" 
                           placeholder="Ej: Cinta de correr profesional" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="categoria" class="required">Categoría</label>
                        <select id="categoria" class="form-control form-select" required>
                            <option value="">Seleccionar categoría</option>
                            <option value="cardio">Cardio</option>
                            <option value="fuerza">Fuerza</option>
                            <option value="peso_libre">Peso Libre</option>
                            <option value="maquinas">Máquinas</option>
                            <option value="accesorios">Accesorios</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="modelo" class="required">Modelo</label>
                        <input type="text" id="modelo" class="form-control" 
                               placeholder="Ej: TRX-5000" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="marca">Marca</label>
                    <input type="text" id="marca" class="form-control" 
                           placeholder="Ingrese la marca">
                </div>

                <div class="form-group">
                    <label for="descripcion" class="required">Descripción</label>
                    <textarea id="descripcion" class="form-control form-textarea" 
                              placeholder="Describe el equipo, características, especificaciones..." 
                              rows="4" required></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="numero_serie">Número de Serie</label>
                        <input type="text" id="numero_serie" class="form-control" 
                               placeholder="Ingrese el número de serie">
                    </div>
                    
                    <div class="form-group">
                        <label for="fecha_adquisicion" class="required">Fecha de Adquisición</label>
                        <input type="date" id="fecha_adquisicion" class="form-control" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="estado" class="required">Estado</label>
                        <select id="estado" class="form-control form-select" required>
                            <option value="">Seleccionar estado</option>
                            <option value="disponible">Disponible</option>
                            <option value="mantenimiento">En Mantenimiento</option>
                            <option value="reparacion">En Reparación</option>
                            <option value="baja">De Baja</option>
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="condicion" class="required">Condición</label>
                        <select id="condicion" class="form-control form-select" required>
                            <option value="">Seleccionar condición</option>
                            <option value="excelente">Excelente</option>
                            <option value="bueno">Bueno</option>
                            <option value="regular">Regular</option>
                            <option value="malo">Malo</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="ubicacion">Ubicación en el Gimnasio</label>
                        <input type="text" id="ubicacion" class="form-control" 
                               placeholder="Ej: Zona de cardio, área A">
                    </div>
                    
                    <div class="form-group">
                        <label for="valor">Valor (€)</label>
                        <input type="number" id="valor" class="form-control" 
                               placeholder="Valor del equipo" step="0.01" min="0">
                    </div>
                </div>

                <div class="form-group">
                    <label for="notas">Notas Adicionales</label>
                    <textarea id="notas" class="form-control form-textarea" 
                              placeholder="Notas sobre mantenimiento, reparaciones, etc..." 
                              rows="3"></textarea>
                </div>

                <div class="form-actions">
                    <a href="{% url 'entrenador:equipos' %}" class="btn btn-secondary">
                        <i class="fas fa-times"></i> Cancelar
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Guardar Equipo
                    </button>
                </div>
            </form>
        </div>
    </div>
</main>
{% endblock %}

{% block extra_js %}
<script src="{% static 'entrenador/js/pages/formulario_equipo.js' %}"></script>
{% endblock %}
