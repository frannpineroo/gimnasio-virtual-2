{% extends 'entrenador/base.html' %}
{% load static %}

{% block title %}Nuevo Entrenador{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'entrenador/css/components/formularios.css' %}">
{% endblock %}

{% block content %}
<main class="main-content">
    <div class="form-page-section">
        <div class="form-container">
            <div class="form-header">
                <h1 class="form-title">Nuevo Entrenador</h1>
                <a href="{% url 'entrenador:entrenadores' %}" class="form-back-btn">
                    <i class="fas fa-arrow-left"></i> Volver a Entrenadores
                </a>
            </div>

            <form id="entrenador-form" class="form-content">
                <div class="form-row">
                    <div class="form-group">
                        <label for="name" class="required">Nombre</label>
                        <input type="text" id="name" name="name" class="form-control" 
                               placeholder="Ingrese el nombre" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="last_name" class="required">Apellido</label>
                        <input type="text" id="last_name" name="last_name" class="form-control" 
                               placeholder="Ingrese el apellido" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="dni" class="required">DNI</label>
                        <input type="text" id="dni" name="dni" class="form-control" 
                               placeholder="Ingrese el DNI" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="phone">Teléfono</label>
                        <input type="tel" id="phone" name="phone" class="form-control" 
                               placeholder="Ingrese el teléfono">
                    </div>
                </div>

                <div class="form-group">
                    <label for="email" class="required">Email</label>
                    <input type="email" id="email" name="email" class="form-control" 
                           placeholder="Ingrese el email" required>
                </div>

                <div class="form-group">
                    <label for="specialty">Especialidad</label>
                    <input type="text" id="specialty" name="specialty" class="form-control" 
                           placeholder="Ej: Fuerza y acondicionamiento">
                </div>

                <div class="form-group">
                    <label for="status">Estado</label>
                    <select id="status" name="status" class="form-control form-select">
                        <option value="active">Activo</option>
                        <option value="inactive">Inactivo</option>
                    </select>
                </div>

                <div class="form-actions">
                    <a href="{% url 'entrenador:entrenadores' %}" class="btn btn-secondary">
                        <i class="fas fa-times"></i> Cancelar
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Guardar Entrenador
                    </button>
                </div>
            </form>
        </div>
    </div>
</main>
{% endblock %}
