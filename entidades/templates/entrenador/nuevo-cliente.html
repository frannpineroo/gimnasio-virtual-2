{% extends 'entrenador/base.html' %}
{% load static %}

{% block title %}Nuevo Cliente{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'entrenador/css/components/formularios.css' %}">
{% endblock %}

{% block content %}
<main class="main-content">
    <div class="form-page-section">
        <div class="form-container">
            <div class="form-header">
                <h1 class="form-title">Nuevo Cliente</h1>
                <a href="{% url 'entrenador:clientes' %}" class="form-back-btn">
                    <i class="fas fa-arrow-left"></i> Volver a Clientes
                </a>
            </div>

            <form id="cliente-form" class="form-content">
                <div class="form-row">
                    <div class="form-group">
                        <label for="nombre" class="required">Nombre</label>
                        <input type="text" id="nombre" class="form-control" 
                               placeholder="Ingrese el nombre" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="apellido" class="required">Apellido</label>
                        <input type="text" id="apellido" class="form-control" 
                               placeholder="Ingrese el apellido" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="dni" class="required">DNI</label>
                        <input type="text" id="dni" class="form-control" 
                               placeholder="Ingrese el DNI" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="telefono" class="required">Teléfono</label>
                        <input type="tel" id="telefono" class="form-control" 
                               placeholder="Ingrese el teléfono" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email" class="required">Email</label>
                    <input type="email" id="email" class="form-control" 
                           placeholder="Ingrese el email" required>
                </div>

                <div class="form-group">
                    <label for="direccion">Dirección</label>
                    <input type="text" id="direccion" class="form-control" 
                           placeholder="Ingrese la dirección">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="fecha_nacimiento" class="required">Fecha de Nacimiento</label>
                        <input type="date" id="fecha_nacimiento" class="form-control" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="genero">Género</label>
                        <select id="genero" class="form-control form-select">
                            <option value="">Seleccionar género</option>
                            <option value="M">Masculino</option>
                            <option value="F">Femenino</option>
                            <option value="O">Otro</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="objetivos">Objetivos</label>
                    <textarea id="objetivos" class="form-control form-textarea" 
                              placeholder="Describe los objetivos del cliente..." rows="4"></textarea>
                </div>

                <div class="form-group">
                    <label for="observaciones">Observaciones Médicas</label>
                    <textarea id="observaciones" class="form-control form-textarea" 
                              placeholder="Observaciones médicas importantes..." rows="3"></textarea>
                </div>

                <div class="form-group">
                    <div class="form-check">
                        <input type="checkbox" id="activo" class="form-check-input" checked>
                        <label for="activo" class="form-check-label">Cliente activo</label>
                    </div>
                </div>

                <div class="form-actions">
                    <a href="{% url 'entrenador:clientes' %}" class="btn btn-secondary">
                        <i class="fas fa-times"></i> Cancelar
                    </a>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Guardar Cliente
                    </button>
                </div>
            </form>
        </div>
    </div>
</main>
{% endblock %}

{% block extra_js %}
<script src="{% static 'entrenador/js/pages/formulario_cliente.js' %}"></script>
{% endblock %}
