<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TRAINING! - Ejercicios</title>
    
    <!-- CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    
    <!-- CSS OPTIMIZADO CON RUTAS CORRECTAS -->
    <link rel="stylesheet" href="css/base/variables.css" />
    <link rel="stylesheet" href="css/base/globals.css" />
    <link rel="stylesheet" href="css/components/header.css" />
    <link rel="stylesheet" href="css/components/sidebar.css" />
    <link rel="stylesheet" href="css/components/table.css" />
    <link rel="stylesheet" href="css/components/buttons.css" />
    <link rel="stylesheet" href="css/components/modal.css" />
    <link rel="stylesheet" href="css/components/filters.css" />
    <link rel="stylesheet" href="css/pages/ejercicios.css" />
</head>
<body>
    <main class="main-content">
        <!-- El header se insertará aquí -->

        <!-- Sección de Ejercicios -->
        <div class="exercises-section">
            <div class="section-header">
                <h2 class="section-title">Gestión de Ejercicios</h2>
                <button class="btn btn-primary" id="add-exercise-btn">
                    <i class="fas fa-plus"></i> Nuevo Ejercicio
                </button>
            </div>

            <!-- Filtros Reutilizables -->
            <div class="filters">
                <div class="filter-group">
                    <label class="filter-label"><i class="fas fa-search"></i> Buscar</label>
                    <div class="search">
                        <i class="fas fa-search"></i>
                        <input type="text" placeholder="Buscar ejercicio..." id="search-input" />
                    </div>
                </div>

                <div class="filter-group">
                    <label class="filter-label"><i class="fas fa-dumbbell"></i> Músculo</label>
                    <div class="custom-select" id="muscle-select">
                        <div class="select-trigger">
                            <div class="selected-value">
                                <i class="fas fa-list"></i>
                                <span>Todos los músculos</span>
                            </div>
                        </div>
                        <div class="select-options">
                            <div class="select-option" data-value="">
                                <i class="fas fa-list"></i>
                                <span>Todos los músculos</span>
                            </div>
                            <!-- Los músculos se cargarán dinámicamente desde equipamiento -->
                        </div>
                    </div>
                </div>

                <div class="filter-group">
                    <label class="filter-label" style="opacity: 0;">Acciones</label>
                    <button id="reset-filters" class="btn btn-secondary">
                        <i class="fas fa-sync-alt"></i> Resetear
                    </button>
                </div>
            </div>

            <!-- Tabla Reutilizable -->
            <div class="table-container">
                <table class="data-table" id="exercises-table">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Músculo</th>
                            <th>Equipamiento</th>
                            <th>Descripción</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="exercises-table-body">
                        <!-- Datos cargados dinámicamente -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal Base Reutilizable -->
    <div class="modal" id="exercise-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Nuevo Ejercicio</h2>
                <button class="close-modal" id="close-modal">&times;</button>
            </div>
            <form id="exercise-form" class="modal-form">
                <input type="hidden" id="exercise-id">
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="exercise-name">Nombre *</label>
                        <input type="text" id="exercise-name" required placeholder="Ej: Press de Banca">
                    </div>
                    <div class="form-group">
                        <label for="exercise-muscle">Músculo principal *</label>
                        <select id="exercise-muscle" required>
                            <option value="">Seleccionar músculo</option>
                            <!-- Los músculos se cargarán dinámicamente desde equipamiento -->
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="exercise-equipment">Equipamiento necesario *</label>
                    <select id="exercise-equipment" required>
                        <option value="">Seleccionar equipamiento</option>
                        <!-- El equipamiento se cargará dinámicamente -->
                    </select>
                </div>

                <div class="form-group">
                    <label for="exercise-description">Descripción</label>
                    <textarea id="exercise-description" rows="3" placeholder="Describe el ejercicio, técnica, músculos involucrados..."></textarea>
                </div>

                <div class="form-group">
                    <label for="exercise-image">Imagen (URL)</label>
                    <input type="text" id="exercise-image" placeholder="https://ejemplo.com/imagen.jpg">
                    <small class="form-help">Pega la URL de una imagen del ejercicio (opcional)</small>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="cancel-form">Cancelar</button>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Guardar Ejercicio
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- SCRIPTS OPTIMIZADOS -->
    <script src="js/utils/constants.js"></script>
    <script src="js/utils/helpers.js"></script>
    <script src="js/utils/storage.js"></script>
    <script src="js/components/header.js"></script>
    <script src="js/components/sidebar.js"></script>
    <script src="js/components/table-manager.js"></script>
    <script src="js/components/modal-manager.js"></script>
    <script src="js/core/app.js"></script>
    <script src="js/pages/ejercicios.js"></script>
</body>
</html>
