{% extends 'entrenador/base.html' %}
{% load static %}

{% block title %}Nuevo Equipo{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'entrenador/css/components/formularios.css' %}">
{% endblock %}

{% block content %}
<main class="main-content">
    <div class="form-page-section">
        <div class="form-container">
            <div class="form-header">
                <h1 class="form-title">Nuevo Equipo</h1>
                <a href="{% url 'entrenador:equipos' %}" class="form-back-btn">
                    <i class="fas fa-arrow-left"></i> Volver a Equipos
                </a>
            </div>

            <form id="equipo-form" class="form-content">
                <div class="form-group">
                    <label for="name" class="required">Nombre del Equipo</label>
                    <input type="text" id="name" name="name" class="form-control" 
                           placeholder="Ej: Cinta de correr profesional" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="category" class="required">Categoría</label>
                        <input type="text" id="category" name="category" class="form-control" 
                               placeholder="Ej: Cardio, Fuerza, Peso Libre" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="model">Modelo</label>
                        <input type="text" id="model" name="model" class="form-control" 
                               placeholder="Ej: TRX-5000">
                    </div>
                </div>

                <div class="form-group">
                    <label for="description">Descripción</label>
                    <textarea id="description" name="description" class="form-control form-textarea" 
                              placeholder="Describe el equipo, características..." 
                              rows="4"></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="purchase_date">Fecha de Compra</label>
                        <input type="date" id="purchase_date" name="purchase_date" class="form-control">
                    </div>
                    
                    <div class="form-group">
                        <label for="status" class="required">Estado</label>
                        <select id="status" name="status" class="form-select" required>
                            <option value="">Seleccionar estado</option>
                            <option value="available">Disponible</option>
                            <option value="in_maintenance">En Mantenimiento</option>
                            <option value="out_of_order">Fuera de Servicio</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="condition" class="required">Condición</label>
                    <select id="condition" name="condition" class="form-select" required>
                        <option value="">Seleccionar condición</option>
                        <option value="new">Nuevo</option>
                        <option value="good">Bueno</option>
                        <option value="fair">Regular</option>
                        <option value="poor">Malo</option>
                    </select>
                </div>

                <div class="form-actions">
                    <!-- Enlace simple para cancelar, sin JS inline -->
                    <a href="{% url 'entrenador:equipos' %}" class="btn-form-cancel">
                        <i class="fas fa-times"></i> Cancelar
                    </a>
                    <button type="submit" class="btn-form-submit">
                        <i class="fas fa-save"></i> Guardar Equipo
                    </button>
                </div>
            </form>
        </div>
    </div>
</main>
{% endblock %}
