{% extends 'entrenador/base.html' %}
{% load static %}

{% block title %}Nuevo Ejercicio{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'entrenador/css/components/formularios.css' %}">
{% endblock %}

{% block content %}
<main class="main-content">
    <div class="form-page-section">
        <div class="form-container">
            <div class="form-header">
                <h1 class="form-title">Nuevo Ejercicio</h1>
                <a href="{% url 'entrenador:ejercicios' %}" class="form-back-btn">
                    <i class="fas fa-arrow-left"></i> Volver a Ejercicios
                </a>
            </div>

            <form id="ejercicio-form" class="form-content">
                <div class="form-group">
                    <label for="name" class="required">Nombre del Ejercicio</label>
                    <input type="text" id="name" name="name" class="form-control" 
                           placeholder="Ej: Sentadilla con barra" required>
                </div>

                <div class="form-group">
                    <label for="description">Descripción</label>
                    <textarea id="description" name="description" class="form-control form-textarea" 
                              placeholder="Describe el ejercicio, técnica, precauciones..." 
                              rows="5"></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="muscle_group">Grupo Muscular</label>
                        <select id="muscle_group" name="muscle_group" class="form-select">
                            <option value="">Seleccionar grupo muscular</option>
                            {% for grupo in grupos_musculares %}
                            <option value="{{ grupo.id }}">{{ grupo.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="form-group">
                        <label for="muscle_subgroup">Subgrupo Muscular</label>
                        <select id="muscle_subgroup" name="muscle_subgroup" class="form-select">
                            <option value="">Seleccionar subgrupo muscular</option>
                            {% for subgrupo in subgrupos_musculares %}
                            <option value="{{ subgrupo.id }}">{{ subgrupo.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="form-actions">
                    <!-- Enlace simple para cancelar, sin JS inline -->
                    <a href="{% url 'entrenador:ejercicios' %}" class="btn-form-cancel">
                        <i class="fas fa-times"></i> Cancelar
                    </a>
                    <button type="submit" class="btn-form-submit">
                        <i class="fas fa-save"></i> Guardar Ejercicio
                    </button>
                </div>
            </form>
        </div>
    </div>
</main>
{% endblock %}
