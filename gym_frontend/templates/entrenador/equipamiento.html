<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TRAINING! - Equipamiento</title>
    
    <!-- CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    
    <!-- CSS OPTIMIZADO -->
    <link rel="stylesheet" href="css/base/variables.css" />
    <link rel="stylesheet" href="css/base/globals.css" />
    <link rel="stylesheet" href="css/components/header.css" />
    <link rel="stylesheet" href="css/components/sidebar.css" />
    <link rel="stylesheet" href="css/components/table.css" />
    <link rel="stylesheet" href="css/components/buttons.css" />
    <link rel="stylesheet" href="css/components/modal.css" />
    <link rel="stylesheet" href="css/components/filters.css" />
</head>
<body>
    <main class="main-content">
        <!-- Sección de Equipamiento -->
        <div class="equipment-section">
            <div class="section-header">
                <h2 class="section-title">Gestión de Equipamiento</h2>
                <button class="btn btn-primary" id="add-equipment-btn">
                    <i class="fas fa-plus"></i> Nuevo Equipo
                </button>
            </div>

            <!-- Filtros Reutilizables -->
            <div class="filters">
                <div class="filter-group">
                    <label class="filter-label"><i class="fas fa-search"></i> Buscar</label>
                    <div class="search">
                        <i class="fas fa-search"></i>
                        <input type="text" placeholder="Buscar equipo..." id="search-input" />
                    </div>
                </div>

                <div class="filter-group">
                    <label class="filter-label"><i class="fas fa-filter"></i> Categoría</label>
                    <div class="custom-select" id="category-select">
                        <div class="select-trigger">
                            <div class="selected-value">
                                <i class="fas fa-list"></i>
                                <span>Todas las categorías</span>
                            </div>
                        </div>
                        <div class="select-options">
                            <div class="select-option" data-value="">
                                <i class="fas fa-list"></i>
                                <span>Todas las categorías</span>
                            </div>
                            <div class="select-option" data-value="cardio">
                                <i class="fas fa-heartbeat"></i>
                                <span>Cardio</span>
                            </div>
                            <div class="select-option" data-value="fuerza">
                                <i class="fas fa-dumbbell"></i>
                                <span>Fuerza</span>
                            </div>
                            <div class="select-option" data-value="accesorios">
                                <i class="fas fa-dumbbell"></i>
                                <span>Accesorios</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="filter-group">
                    <label class="filter-label" style="opacity: 0;">Acciones</label>
                    <button id="reset-filters" class="btn btn-secondary">
                        <i class="fas fa-sync-alt"></i> Resetear
                    </button>
                </div>
            </div>

            <!-- Tabla Reutilizable -->
            <div class="table-container">
                <table class="data-table" id="equipment-table">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Categoría</th>
                            <th>Modelo</th>
                            <th>Estado</th>
                            <th>Condición</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="equipment-table-body">
                        <!-- Datos cargados dinámicamente -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal Base Reutilizable -->
    <div class="modal" id="equipment-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Nuevo Equipo</h2>
                <button class="close-modal" id="close-modal">&times;</button>
            </div>
            <form id="equipment-form" class="modal-form">
                <input type="hidden" id="equipment-id">
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="equipment-name">Nombre *</label>
                        <input type="text" id="equipment-name" required>
                    </div>
                    <div class="form-group">
                        <label for="equipment-category">Categoría *</label>
                        <select id="equipment-category" required>
                            <option value="">Seleccionar</option>
                            <option value="cardio">Cardio</option>
                            <option value="fuerza">Fuerza</option>
                            <option value="accesorios">Accesorios</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="equipment-model">Modelo</label>
                        <input type="text" id="equipment-model">
                    </div>
                    <div class="form-group">
                        <label for="equipment-status">Estado *</label>
                        <select id="equipment-status" required>
                            <option value="available">Disponible</option>
                            <option value="in_maintenance">En Mantenimiento</option>
                            <option value="out_of_order">Fuera de Servicio</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="equipment-condition">Condición *</label>
                        <select id="equipment-condition" required>
                            <option value="new">Nuevo</option>
                            <option value="good">Bueno</option>
                            <option value="fair">Regular</option>
                            <option value="poor">Pobre</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="equipment-purchase-date">Fecha de Compra</label>
                        <input type="date" id="equipment-purchase-date">
                    </div>
                </div>

                <div class="form-group">
                    <label for="equipment-description">Descripción</label>
                    <textarea id="equipment-description" rows="3" placeholder="Descripción del equipo..."></textarea>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="cancel-form">Cancelar</button>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Guardar Equipo
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- SCRIPTS OPTIMIZADOS -->
    <script src="js/utils/constants.js"></script>
    <script src="js/utils/helpers.js"></script>
    <script src="js/utils/storage.js"></script>
    <script src="js/components/header.js"></script>
    <script src="js/components/sidebar.js"></script>
    <script src="js/components/table-manager.js"></script>
    <script src="js/components/modal-manager.js"></script>
    <script src="js/core/app.js"></script>
    <script src="js/pages/equipamiento.js"></script>
</body>
</html>
