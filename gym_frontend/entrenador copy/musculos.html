<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TRAINING! - Músculos</title>
   
    <!-- CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
   
    <!-- CSS OPTIMIZADO CON RUTAS CORRECTAS -->
    <link rel="stylesheet" href="css/base/variables.css" />
    <link rel="stylesheet" href="css/base/globals.css" />
    <link rel="stylesheet" href="css/components/header.css" />
    <link rel="stylesheet" href="css/components/sidebar.css" />
    <link rel="stylesheet" href="css/components/table.css" />
    <link rel="stylesheet" href="css/components/buttons.css" />
    <link rel="stylesheet" href="css/components/modal.css" />
    <link rel="stylesheet" href="css/components/filters.css" />
    <link rel="stylesheet" href="css/pages/musculos.css" />
    
</head>
<body>
    <main class="main-content">
        <!-- El header se insertará aquí -->

        <!-- Sección de Músculos -->
        <div class="muscles-section">
            <div class="section-header">
                <h2 class="section-title">Gestión de Músculos</h2>
                <div class="header-actions">
                    <button class="btn btn-primary" id="add-group-btn">
                        <i class="fas fa-plus"></i> Nuevo Grupo
                    </button>
                    <button class="btn btn-secondary" id="add-subgroup-btn">
                        <i class="fas fa-plus"></i> Nuevo Subgrupo
                    </button>
                </div>
            </div>

            <!-- Filtros Reutilizables -->
            <div class="filters">
                <div class="filter-group">
                    <label class="filter-label"><i class="fas fa-search"></i> Buscar</label>
                    <div class="search">
                        <i class="fas fa-search"></i>
                        <input type="text" placeholder="Buscar músculo..." id="search-input" />
                    </div>
                </div>

                <div class="filter-group">
                    <label class="filter-label"><i class="fas fa-layer-group"></i> Tipo</label>
                    <div class="custom-select" id="type-select">
                        <div class="select-trigger">
                            <div class="selected-value">
                                <i class="fas fa-list"></i>
                                <span>Todos los tipos</span>
                            </div>
                        </div>
                        <div class="select-options">
                            <div class="select-option" data-value="">
                                <i class="fas fa-list"></i>
                                <span>Todos los tipos</span>
                            </div>
                            <div class="select-option" data-value="group">
                                <i class="fas fa-folder"></i>
                                <span>Grupos Musculares</span>
                            </div>
                            <div class="select-option" data-value="subgroup">
                                <i class="fas fa-folder-open"></i>
                                <span>Subgrupos Musculares</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="filter-group">
                    <label class="filter-label" style="opacity: 0;">Acciones</label>
                    <button id="reset-filters" class="btn btn-secondary">
                        <i class="fas fa-sync-alt"></i> Resetear
                    </button>
                </div>
            </div>

            <!-- Tabla Reutilizable -->
            <div class="table-container">
                <table class="data-table" id="muscles-table">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Tipo</th>
                            <th>Grupo Padre</th>
                            <!-- SE ELIMINÓ LA COLUMNA DESCRIPCIÓN -->
                            <th>Ejercicios Asociados</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="muscles-table-body">
                        <!-- Datos cargados dinámicamente -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal para Grupos Musculares -->
    <div class="modal" id="group-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="group-modal-title">Nuevo Grupo Muscular</h2>
                <button class="close-modal" id="close-group-modal">&times;</button>
            </div>
            <form id="group-form" class="modal-form">
                <input type="hidden" id="group-id">
               
                <div class="form-group">
                    <label for="group-name">Nombre del Grupo *</label>
                    <input type="text" id="group-name" required placeholder="Ej: Pectorales">
                </div>

                <!-- SE ELIMINÓ EL CAMPO DE DESCRIPCIÓN -->

                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="cancel-group-form">Cancelar</button>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Guardar Grupo
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modal para Subgrupos Musculares -->
    <div class="modal" id="subgroup-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="subgroup-modal-title">Nuevo Subgrupo Muscular</h2>
                <button class="close-modal" id="close-subgroup-modal">&times;</button>
            </div>
            <form id="subgroup-form" class="modal-form">
                <input type="hidden" id="subgroup-id">
               
                <div class="form-row">
                    <div class="form-group">
                        <label for="subgroup-name">Nombre del Subgrupo *</label>
                        <input type="text" id="subgroup-name" required placeholder="Ej: Pectoral Mayor">
                    </div>
                    <div class="form-group">
                        <label for="subgroup-parent">Grupo Muscular *</label>
                        <select id="subgroup-parent" required>
                            <option value="">Seleccionar grupo</option>
                            <!-- Los grupos se cargarán dinámicamente -->
                        </select>
                    </div>
                </div>

                <!-- SE ELIMINÓ EL CAMPO DE DESCRIPCIÓN -->

                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="cancel-subgroup-form">Cancelar</button>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i> Guardar Subgrupo
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- SCRIPTS OPTIMIZADOS -->
    <script src="js/utils/constants.js"></script>
    <script src="js/utils/helpers.js"></script>
    <script src="js/utils/storage.js"></script>
    <script src="js/components/header.js"></script>
    <script src="js/components/sidebar.js"></script>
    <script src="js/components/table-manager.js"></script>
    <script src="js/components/modal-manager.js"></script>
    <script src="js/core/app.js"></script>
    <script src="js/pages/musculos.js"></script>
</body>
</html>
