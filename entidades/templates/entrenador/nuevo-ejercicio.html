{% extends 'entrenador/base.html' %}

{% block title %}Nuevo Ejercicio{% endblock %}

{% block content %}
<main class="main-content">
    <div class="form-page-section">
        <div class="form-container">
            <div class="form-header">
                <h1 class="form-title">Nuevo Ejercicio</h1>
                <a href="{% url 'entrenador:ejercicios' %}" class="form-back-btn">
                    <i class="fas fa-arrow-left"></i> Volver a Ejercicios
                </a>
            </div>

            <form action="/entrenador/ejercicios/nuevo/" method="post">
                {% csrf_token %}
                {{ form.as_p }}
                
                <div class="form-actions">
                    <a href="{% url 'entrenador:ejercicios' %}" class="btn-form-cancel">
                        <i class="fas fa-times"></i> Cancelar
                    </a>
                    <button type="submit" class="btn-form-submit">
                        <i class="fas fa-save"></i> Guardar Ejercicio
                    </button>
                </div>
            </form>
        </div>
    </div>
</main>
{% endblock %}
